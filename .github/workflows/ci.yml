name: CI

on:
  push:
    branches: [main]
    paths:
      - "packages/ui/**"
      - "apps/showcase/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/ui/**"
      - "apps/showcase/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint · Test · Build · Pack
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspace)
        run: npm ci

      - name: Typecheck (ui)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (ui)
        run: npm test

      - name: Coverage (ui)
        run: npm run test:coverage

      - name: Changeset status (PR 必须带变更集)
        run: npx --prefix packages/ui changeset status --since origin/main || echo "::warning::PR 缺少 changeset 变更集"
        if: github.event_name == 'pull_request'

      - name: Build (ui + showcase)
        run: npm run build

      - name: Build single-file (showcase)
        run: npm run build:single

      - name: Verify single-file output
        run: test -f showcase/reasonix-shadcn-design.html && echo "single-file OK"

      - name: Pack (ui)
        working-directory: packages/ui
        run: npm pack --dry-run

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: reasonix-ui-dist
          path: packages/ui/dist/
