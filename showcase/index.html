<!DOCTYPE html>
<html lang="zh-CN" data-mode="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reasonix 文件结构导航</title>
<style>
:root {
  --bg: #0c0d10; --bg-soft: #15161a; --bg-elev: #1f2026;
  --fg: #f1f1ef; --fg-dim: #9a9ba1; --fg-faint: #7a7a80;
  --border: #2a2b31; --accent: #ff6a3d; --accent-soft: rgba(255,106,61,.14);
  --ok: #3ad17e; --warn: #e3a23a; --err: #f0573f; --info: #4d8df6;
  --r: 8px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
}
[data-mode="light"] {
  --bg: #f4f3ef; --bg-soft: #ffffff; --bg-elev: #eceae3;
  --fg: #16181d; --fg-dim: #6e6e75; --fg-faint: #8a8a90;
  --border: #d8d6cf; --accent: #c93918; --accent-soft: rgba(201,57,24,.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--fg); transition: background .3s, color .3s; }
header {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: .75rem;
  padding: .75rem 1.25rem;
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
header .mark { display: grid; place-items: center; width: 2rem; height: 2rem; border-radius: var(--r); background: var(--accent); color: #0c0d10; font-weight: 800; }
header h1 { font-size: .95rem; font-weight: 700; }
header .path { font-family: var(--mono); font-size: .7rem; color: var(--fg-faint); }
.theme-btn { margin-left: auto; width: 2.1rem; height: 2.1rem; border: 1px solid var(--border); border-radius: var(--r); background: var(--bg-soft); cursor: pointer; font-size: 1rem; }

main { max-width: 56rem; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
.stats { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
.stat { padding: .6rem 1rem; border-radius: var(--r); background: var(--bg-soft); border: 1px solid var(--border); font-size: .75rem; color: var(--fg-dim); }
.stat b { color: var(--accent); font-size: 1.1rem; margin-right: .3rem; }

/* 树形结构 */
.tree { font-family: var(--mono); font-size: .8rem; }
.dir {
  border: 1px solid var(--border); border-radius: var(--r);
  background: var(--bg-soft); margin-bottom: .6rem; overflow: hidden;
}
.dir-head {
  display: flex; align-items: center; gap: .5rem;
  padding: .7rem 1rem; cursor: pointer; user-select: none;
}
.dir-head:hover { background: var(--accent-soft); }
.dir-head .arrow { transition: transform .2s; color: var(--fg-faint); font-size: .65rem; }
.dir-head.open .arrow { transform: rotate(90deg); }
.dir-head .icon { font-size: .9rem; }
.dir-head .name { font-weight: 700; }
.dir-head .count { margin-left: auto; font-size: .65rem; color: var(--fg-faint); background: var(--bg-elev); padding: .1rem .5rem; border-radius: 999px; }
.dir-body { display: none; padding: .3rem 1rem .8rem 2.2rem; }
.dir.open .dir-body { display: block; }
.file {
  display: flex; align-items: center; gap: .5rem;
  padding: .4rem .6rem; border-radius: 6px; cursor: pointer;
  color: var(--fg-dim); text-decoration: none; transition: background .15s;
}
.file:hover { background: var(--accent-soft); color: var(--accent); }
.file .f-icon { font-size: .8rem; }
.file .f-name { flex: 1; }
.file .f-size { font-size: .65rem; color: var(--fg-faint); }
.file .f-badge { font-size: .6rem; padding: .1rem .4rem; border-radius: 999px; }
.b-html { background: color-mix(in srgb, var(--err) 18%, transparent); color: var(--err); }
.b-md { background: color-mix(in srgb, var(--info) 18%, transparent); color: var(--info); }
.b-ts { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.b-py { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }

/* 提示 */
.hint { margin-top: 1.5rem; padding: .8rem 1rem; border-radius: var(--r); background: var(--accent-soft); color: var(--accent); font-size: .75rem; line-height: 1.7; }
</style>
</head>
<body>
<header>
  <span class="mark">R</span>
  <div>
    <h1>Reasonix 文件结构导航</h1>
    <span class="path">reasonix-design-kit/</span>
  </div>
  <button class="theme-btn" id="theme-btn" aria-label="切换明暗">☀️</button>
</header>
<main>
  <div class="stats">
    <div class="stat"><b>5</b>模块</div>
    <div class="stat"><b>38</b>组件</div>
    <div class="stat"><b>7</b>展示页</div>
    <div class="stat"><b>3</b>设计文档</div>
    <div class="stat"><b>170</b>令牌</div>
  </div>

  <div class="tree" id="tree"></div>

  <div class="hint">💡 点击目录展开/折叠 · 点击文件可打开对应展示页或查看源码 · 右上角切换明暗</div>
</main>

<script>
const TREE = [
  {
    name: 'packages/', icon: '📦', desc: '组件库（可发布）',
    files: [
      { name: 'ui/', type: 'dir', children: [
        { name: 'src/components/ui/*.tsx', icon: '🧩', badge: 'ts', desc: '38 个组件源码' },
        { name: 'src/components/ui/*.test.tsx', icon: '🧪', badge: 'ts', desc: '19 个测试文件（72 用例）' },
        { name: 'src/styles.css', icon: '🎨', badge: 'ts', desc: '37 令牌 + 6 方向主题' },
        { name: 'src/index.ts', icon: '🔗', badge: 'ts', desc: '统一导出入口' },
        { name: 'README.md / CHANGELOG.md / LICENSE', icon: '📄', badge: 'md', desc: '使用文档 + 版本记录' },
        { name: '.changeset/', icon: '🦋', badge: 'md', desc: 'changesets 版本管理' },
      ]},
    ],
  },
  {
    name: 'apps/', icon: '🖥️', desc: '展示站源码（React SPA）',
    files: [
      { name: 'showcase/', type: 'dir', children: [
        { name: 'src/components/*.tsx', icon: '⚛️', badge: 'ts', desc: '8 页面组件（欢迎/介绍/工作台/组件库/总览/过渡/动效/设计文档）' },
        { name: 'src/index.css', icon: '🎨', badge: 'ts', desc: '令牌 + 动效体系' },
        { name: 'src/lib/*.ts', icon: '📚', badge: 'ts', desc: '目录/API/主题数据' },
      ]},
    ],
  },
  {
    name: 'showcase/', icon: '🖼️', desc: 'HTML 交付物（双击即开）',
    files: [
      { name: 'index.html', icon: '🏠', badge: 'html', desc: '本文件（结构导航）' },
      { name: 'reasonix-ui-intro.html', icon: '✨', badge: 'html', desc: '组件库介绍页' },
      { name: 'reasonix-shadcn-design.html', icon: '🖥️', badge: 'html', desc: 'SPA 单文件（8 页）' },
      { name: 'reasonix-components-showcase.html', icon: '🧩', badge: 'html', desc: '97 组件讲解' },
      { name: 'reasonix-design-showcase.html', icon: '🎨', badge: 'html', desc: '6 方向主题演示' },
      { name: 'reasonix-mobile-components-showcase.html', icon: '📱', badge: 'html', desc: '60 移动组件' },
      { name: 'reasonix-workbench-clone.html', icon: '💻', badge: 'html', desc: '工作台复刻' },
      { name: 'anytdf-landing.html', icon: '🌐', badge: 'html', desc: '官网 landing' },
    ],
  },
  {
    name: 'docs/', icon: '📖', desc: '设计规范文档',
    files: [
      { name: 'DESIGN.md', icon: '📐', badge: 'md', desc: '9 章设计规范（色彩/排版/形状/运动/Checklist）' },
      { name: 'reasonix-desktop-design.md', icon: '🖥️', badge: 'md', desc: '桌面端主题系统' },
      { name: 'reasonix-desktop-components.md', icon: '🧩', badge: 'md', desc: '99 组件源码大全（1.9MB）' },
    ],
  },
  {
    name: 'scripts/', icon: '🔧', desc: '生成脚本',
    files: [
      { name: '_genmobile.py', icon: '🐍', badge: 'py', desc: '移动端组件展示页生成器' },
    ],
  },
]

const tree = document.getElementById('tree')
TREE.forEach((dir, di) => {
  const d = document.createElement('div')
  d.className = 'dir'
  const head = document.createElement('div')
  head.className = 'dir-head'
  head.innerHTML = `<span class="arrow">▸</span><span class="icon">${dir.icon}</span><span class="name">${dir.name}</span><span class="count">${dir.files.length}</span>`
  const body = document.createElement('div')
  body.className = 'dir-body'

  const renderFiles = (files, parent) => {
    files.forEach(f => {
      if (f.type === 'dir') {
        const sub = document.createElement('div')
        sub.className = 'dir'
        const subHead = document.createElement('div')
        subHead.className = 'dir-head'
        subHead.innerHTML = `<span class="arrow">▸</span><span class="icon">${f.icon || '📁'}</span><span class="name">${f.name}</span><span class="count">${f.children.length}</span>`
        const subBody = document.createElement('div')
        subBody.className = 'dir-body'
        renderFiles(f.children, subBody)
        sub.appendChild(subHead); sub.appendChild(subBody)
        subHead.onclick = () => { sub.classList.toggle('open'); subHead.classList.toggle('open') }
        parent.appendChild(sub)
      } else {
        const a = document.createElement('a')
        a.className = 'file'
        a.href = f.href || '#'
        a.innerHTML = `<span class="f-icon">${f.icon}</span><span class="f-name">${f.name}</span><span class="f-badge b-${f.badge}">${f.badge}</span><span class="f-size">${f.desc}</span>`
        parent.appendChild(a)
      }
    })
  }
  renderFiles(dir.files, body)
  d.appendChild(head); d.appendChild(body)
  head.onclick = () => { d.classList.toggle('open'); head.classList.toggle('open') }
  tree.appendChild(d)
})
// 默认展开 showcase 目录
document.querySelectorAll('.dir')[2]?.click()

// 明暗切换
const themeBtn = document.getElementById('theme-btn')
themeBtn.onclick = () => {
  const dark = document.documentElement.getAttribute('data-mode') === 'dark'
  document.documentElement.setAttribute('data-mode', dark ? 'light' : 'dark')
  themeBtn.textContent = dark ? '🌙' : '☀️'
}
</script>
</body>
</html>
