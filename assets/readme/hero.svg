<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">Reasonix 设计系统</title>
  <desc id="desc">38 个 React 组件、6 方向主题、37 个设计令牌与动效体系的开箱即用集合。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0d10"/>
      <stop offset="100%" stop-color="#15161a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6a3d"/>
      <stop offset="100%" stop-color="#ff9a52"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="400" rx="26" fill="url(#bg)"/>

  <!-- 左侧：标题块 -->
  <g transform="translate(56 40)">
    <rect x="0" y="0" width="96" height="24" rx="12" fill="rgba(255,106,61,0.16)"/>
    <text x="48" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#ff6a3d" letter-spacing="2">REASONIX</text>

    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="64" font-weight="800" fill="#f1f1ef" letter-spacing="-1">Reasonix 设计系统</text>

    <text x="0" y="120" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="24" font-weight="400" fill="#9a9ba1">一套共享产品语言：主题令牌 · 组件 · 动效</text>

    <!-- 数据条 -->
    <g transform="translate(0 160)">
      <rect x="0" y="0" width="150" height="52" rx="10" fill="#1f2026" stroke="#2a2b31"/>
      <text x="75" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#ff6a3d">38</text>
      <text x="75" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="10" fill="#7a7a80">组件</text>

      <rect x="162" y="0" width="150" height="52" rx="10" fill="#1f2026" stroke="#2a2b31"/>
      <text x="237" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#ff6a3d">37</text>
      <text x="237" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="10" fill="#7a7a80">设计令牌</text>

      <rect x="324" y="0" width="150" height="52" rx="10" fill="#1f2026" stroke="#2a2b31"/>
      <text x="399" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#ff6a3d">72</text>
      <text x="399" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="10" fill="#7a7a80">测试用例</text>

      <rect x="486" y="0" width="150" height="52" rx="10" fill="#1f2026" stroke="#2a2b31"/>
      <text x="561" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#ff6a3d">6</text>
      <text x="561" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="10" fill="#7a7a80">主题方向</text>
    </g>

    <!-- 安装命令 -->
    <g transform="translate(0 240)">
      <rect x="0" y="0" width="560" height="44" rx="10" fill="#050607" stroke="#2a2b31"/>
      <text x="20" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#f1f1ef">
        <tspan fill="#3ad17e">$</tspan>
        <tspan fill="#9a9ba1"> npm install </tspan>
        <tspan fill="#ff6a3d">@reasonix/ui</tspan>
      </text>
    </g>
  </g>

  <!-- 右侧：6 方向色板（项目证明） -->
  <g transform="translate(740 40)">
    <text x="0" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#7a7a80" letter-spacing="2">6 主题方向</text>

    <!-- 色板网格 3x2 -->
    <g transform="translate(0 32)">
      <!-- row 1 -->
      <rect x="0" y="0" width="132" height="96" rx="12" fill="#1f2026" stroke="#2a2b31"/>
      <rect x="12" y="12" width="108" height="40" rx="8" fill="#ff6a3d"/>
      <text x="24" y="78" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#f1f1ef">石墨</text>
      <text x="86" y="78" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7a7a80">graphite</text>

      <rect x="144" y="0" width="132" height="96" rx="12" fill="#1f2026" stroke="#2a2b31"/>
      <rect x="156" y="12" width="108" height="40" rx="8" fill="#8b7cff"/>
      <text x="168" y="78" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#f1f1ef">极光</text>
      <text x="230" y="78" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7a7a80">aurora</text>

      <rect x="288" y="0" width="132" height="96" rx="12" fill="#1f2026" stroke="#2a2b31"/>
      <rect x="300" y="12" width="108" height="40" rx="8" fill="#4d8df6"/>
      <text x="312" y="78" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#f1f1ef">石板</text>
      <text x="374" y="78" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7a7a80">slate</text>

      <!-- row 2 -->
      <rect x="0" y="108" width="132" height="96" rx="12" fill="#1f2026" stroke="#2a2b31"/>
      <rect x="12" y="120" width="108" height="40" rx="8" fill="#2dd4bf"/>
      <text x="24" y="186" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#f1f1ef">碳</text>
      <text x="86" y="186" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7a7a80">carbon</text>

      <rect x="144" y="108" width="132" height="96" rx="12" fill="#1f2026" stroke="#2a2b31"/>
      <rect x="156" y="120" width="108" height="40" rx="8" fill="#818cf8"/>
      <text x="168" y="186" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#f1f1ef">夜曲</text>
      <text x="230" y="186" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7a7a80">nocturne</text>

      <rect x="288" y="108" width="132" height="96" rx="12" fill="#1f2026" stroke="#2a2b31"/>
      <rect x="300" y="120" width="108" height="40" rx="8" fill="#d4632f"/>
      <text x="312" y="186" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#f1f1ef">琥珀</text>
      <text x="374" y="186" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7a7a80">amber</text>
    </g>
  </g>
</svg>
