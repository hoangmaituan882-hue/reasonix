<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="130" viewBox="0 0 1200 130"
     role="img" aria-labelledby="title desc">
  <title id="title">组件</title>
  <desc id="desc">38 个 React 组件，覆盖五大分类。</desc>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3ad17e"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="130" rx="16" fill="#15161a"/>
  <rect x="0" y="0" width="6" height="130" rx="3" fill="url(#grad)"/>
  <text x="48" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#3ad17e" letter-spacing="3">COMPONENTS</text>
  <text x="48" y="92" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="34" font-weight="800" fill="#f1f1ef" letter-spacing="-0.5">38 个组件，五大分类</text>
  <text x="430" y="86" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="15" fill="#9a9ba1">基础 · 表单 · 数据 · 反馈 · 导航</text>
</svg>
