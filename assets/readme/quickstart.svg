<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="130" viewBox="0 0 1200 130"
     role="img" aria-labelledby="title desc">
  <title id="title">快速开始</title>
  <desc id="desc">两步接入 Reasonix 组件库。</desc>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4d8df6"/>
      <stop offset="100%" stop-color="#6ea4f9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="130" rx="16" fill="#15161a"/>
  <rect x="0" y="0" width="6" height="130" rx="3" fill="url(#grad)"/>
  <text x="48" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#4d8df6" letter-spacing="3">QUICKSTART</text>
  <text x="48" y="92" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="34" font-weight="800" fill="#f1f1ef" letter-spacing="-0.5">快速开始</text>
  <text x="360" y="86" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="15" fill="#9a9ba1">安装 → 引入组件 → 切换主题</text>
</svg>
